workflows:
  # ============================================
  # iOS Native Build → TestFlight
  # ============================================
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodemagicASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.drawbattle.app
      node: 20
      cocoapods: default
      xcode: latest
      vars:
        BUNDLE_ID: "com.drawbattle.app"
        APP_NAME: "Draw Battle"
        XCODE_WORKSPACE: "ios/DrawBattle.xcworkspace"
        XCODE_SCHEME: "DrawBattle"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: release/*
          include: true
      cancel_previous_builds: true
    scripts:
      # --- 依存関係インストール ---
      - name: Install Node dependencies
        script: |
          npm ci --legacy-peer-deps

      - name: Run tests
        script: |
          npm test -- --passWithNoTests
        ignore_failure: true

      # --- ネイティブプロジェクト生成 ---
      - name: Generate native iOS project
        script: |
          npx expo prebuild --platform ios --clean

      # --- CocoaPods ---
      - name: Install CocoaPods
        script: |
          cd ios && pod install

      # --- コード署名 (Codemagic自動管理) ---
      - name: Set up code signing
        script: |
          xcode-project use-profiles

      # --- ビルド番号自動インクリメント ---
      - name: Increment build number
        script: |
          cd ios
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo 1)
          echo "Latest TestFlight build number: $LATEST_BUILD"
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "Setting new build number: $NEW_BUILD"
          agvtool new-version -all $NEW_BUILD

      # --- Xcodeビルド ---
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"

  # ============================================
  # iOS Preview Build (PRテスト用 - AdHoc)
  # ============================================
  ios-preview:
    name: iOS Preview (AdHoc)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodemagicASC
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.drawbattle.app
      node: 20
      cocoapods: default
      xcode: latest
      vars:
        XCODE_WORKSPACE: "ios/DrawBattle.xcworkspace"
        XCODE_SCHEME: "DrawBattle"
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install Node dependencies
        script: |
          npm ci --legacy-peer-deps

      - name: Run tests
        script: |
          npm test -- --passWithNoTests
        ignore_failure: true

      - name: Generate native iOS project
        script: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
